
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>WeatherNow ☀️</h1>
            <p>Check weather around the world</p>
        </header>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <p id="status"></p>

        <div id="weather" class="weather-card" hidden>
            <h2 id="cityName"></h2>
            <div id="weatherIcon" class="icon">🌤️</div>
            <h1 id="temperature"></h1>
            <p id="condition"></p>

            <div class="details">
                <div>
                    <h3>💧 Humidity</h3>
                    <p id="humidity"></p>
                </div>

                <div>
                    <h3>💨 Wind Speed</h3>
                    <p id="wind"></p>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
